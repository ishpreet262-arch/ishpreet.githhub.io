<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background:#020617;
    color:white;
    text-align:center;
}
.header{
    background:#000814;
    padding:20px;
    font-size:26px;
    color:#22c55e;
}
.ticker{
    background:#111827;
    padding:10px;
    color:#22c55e;
    font-size:18px;
}
.box{
    margin-top:80px;
}
input{
    padding:15px;
    width:350px;
    border-radius:8px;
    border:none;
    font-size:16px;
}
button{
    padding:15px 35px;
    background:#22c55e;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}
.footer{
margin-top:80px;
color:gray;
}
</style>
</head>

<body>

<div class="header">📈 AI Stock Prediction System</div>

<div class="ticker">
Live Supported: RELIANCE | TCS | INFY | AAPL | ^NSEI | ^DJI
</div>

<div class="box">
<h2>Enter Stock or Index</h2>
<form action="/predict" method="post">
<input type="text" name="stock" placeholder="Example: RELIANCE, AAPL, ^NSEI">
<br><br>
<button type="submit">Predict Now</button>
</form>
</div>

<div class="footer">
Developed by Ishpreet Singh | BSc Computer Science Project
</div>

</body>
</html>
